<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Pagina Web - 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container-fluid">
        <!--
            5 filas (row), cada una con una pareja: section (amarillo) + aside (morado).
            Anchos por dispositivo (de 12 columnas):

                         MÓVIL        TABLET       ESCRITORIO
                         col / sm     md / lg      xl / xxl
            Fila 1       6  - 6       3  - 9       9  - 3
            Fila 2       6  - 6       4  - 8       3  - 9
            Fila 3       6  - 6       6  - 6       9  - 3
            Fila 4       12 / 12*     4  - 8       3  - 9      (* en móvil el morado va arriba)
            Fila 5       6  - 6       3  - 9       6  - 6
        -->

        <!-- Fila 1 -->
        <div class="row">
            <section class="col-6 col-sm-6 col-md-3 col-lg-3 col-xl-9 col-xxl-9 altura"></section>
            <aside   class="col-6 col-sm-6 col-md-9 col-lg-9 col-xl-3 col-xxl-3 altura"></aside>
        </div>

        <!-- Fila 2 -->
        <div class="row">
            <section class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3 col-xxl-3 altura"></section>
            <aside   class="col-6 col-sm-6 col-md-8 col-lg-8 col-xl-9 col-xxl-9 altura"></aside>
        </div>

        <!-- Fila 3 -->
        <div class="row">
            <section class="col-6 col-sm-6 col-md-6 col-lg-6 col-xl-9 col-xxl-9 altura"></section>
            <aside   class="col-6 col-sm-6 col-md-6 col-lg-6 col-xl-3 col-xxl-3 altura"></aside>
        </div>

        <!-- Fila 4: en móvil se apilan y el morado va PRIMERO (order); desde tablet vuelve el amarillo a la izquierda -->
        <div class="row">
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-3 col-xxl-3 order-2 order-md-1 altura"></section>
            <aside   class="col-12 col-sm-12 col-md-8 col-lg-8 col-xl-9 col-xxl-9 order-1 order-md-2 altura"></aside>
        </div>

        <!-- Fila 5 -->
        <div class="row">
            <section class="col-6 col-sm-6 col-md-3 col-lg-3 col-xl-6 col-xxl-6 altura"></section>
            <aside   class="col-6 col-sm-6 col-md-9 col-lg-9 col-xl-6 col-xxl-6 altura"></aside>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
